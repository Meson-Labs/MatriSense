name: matrisense_app
description: "A cross-platform Flutter mobile application for MatriSense Edge AI maternal and infant health monitor."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Cupertino Icons for iOS UI elements
  cupertino_icons: ^1.0.8

  # Bluetooth Low Energy library for connecting to MatriSense-Node
  flutter_blue_plus: ^1.31.0

  # Path provider for accessing local app storage for CSV logging
  path_provider: ^2.1.2

  # Native sharing dialog for exporting CSV telemetry via WhatsApp/Email
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linter rules for clean, maintainable Dart code
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Asset declaration section (uncomment if adding project logos/icons later)
  # assets:
  #   - assets/images/
